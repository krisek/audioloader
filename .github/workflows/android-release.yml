name: Android Release

# Tag with: git tag android-v1.2.3 && git push origin android-v1.2.3
on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # versionCode grows with every tag push: seconds since 2024-01-01 / 60 fits an int for decades.
          echo "VERSION_CODE=$(( ($(date +%s) - 1704067200) / 60 ))" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle --no-daemon testReleaseUnitTest

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "audioloader-remote-$VERSION.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: android/audioloader-remote-${{ env.VERSION }}.apk
          generate_release_notes: true
          # Only a suffix after the version (android-v1.2.3-rc1) makes it a pre-release; the tag prefix has a dash too.
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
